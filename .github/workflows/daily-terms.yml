# deduplication.tech — keeps the site growing through the editor queue at deduplication.tech/admin.
#  · Mondays:  MINE    find ~1,000 competing word pairs, check them on Wikipedia, add them to discovery/queue.json as "pending"
#  · Both:     REVIEW  the automatic editor (scripts/review-queue.mjs, data only, no AI) accepts or rejects; admins fix or remove later
#  · Daily:    PUBLISH turn the next DAILY_LIMIT (default 50) ACCEPTED terms into pages, bake their
#                      Wikipedia pageviews and sources, build, push to main (Vercel deploys)
#  · 2nd of the month: re-collect pageviews and sources for every term
#  · Manual:   Actions tab → daily-terms → Run workflow → pick a task
#
# Repo settings (Settings → Secrets and variables → Actions):
#   variable DAILY_LIMIT        terms to publish per day (default 50)
#   variable QUEUE_TARGET       how many pending candidates the miner keeps ready (default 1000)
#   variables MIN_VIEWS_EACH / MIN_VIEWS_TOTAL  the auto-accept traffic bar (defaults 50000 / 300000)
#   secrets  HN_SEARCH_APP / HN_SEARCH_KEY / HN_SEARCH_INDEX  optional: earliest HackerNoon story on each page
name: daily-terms
on:
  schedule:
    - cron: '17 13 * * *'   # daily publish, 6:17am Mountain
    - cron: '23 9 * * 1'    # Monday mining
    - cron: '41 9 2 * *'    # monthly full refresh
  workflow_dispatch:
    inputs:
      task: { description: 'What to run', type: choice, options: [publish, mine, refresh-all], default: publish }
permissions:
  contents: write
concurrency: { group: daily-terms, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '50' }}
      QUEUE_TARGET: ${{ vars.QUEUE_TARGET || '1000' }}
      MIN_VIEWS_EACH: ${{ vars.MIN_VIEWS_EACH || '50000' }}
      MIN_VIEWS_TOTAL: ${{ vars.MIN_VIEWS_TOTAL || '300000' }}
      HN_SEARCH_APP: ${{ secrets.HN_SEARCH_APP }}
      HN_SEARCH_KEY: ${{ secrets.HN_SEARCH_KEY }}
      HN_SEARCH_INDEX: ${{ secrets.HN_SEARCH_INDEX }}
      TASK: ${{ inputs.task || (github.event.schedule == '23 9 * * 1' && 'mine') || (github.event.schedule == '41 9 2 * *' && 'refresh-all') || 'publish' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # ---- mine ----
      - name: Mine new candidates into the queue
        if: env.TASK == 'mine'
        run: node scripts/mine-queue.mjs && node scripts/review-queue.mjs

      # ---- publish ----
      - name: Auto-review anything still pending, then publish accepted terms
        if: env.TASK == 'publish'
        run: node scripts/review-queue.mjs && node scripts/publish-queue.mjs
      - name: Check new terms on Wikipedia
        if: env.TASK == 'publish'
        run: node scripts/validate-terms.mjs
      - name: Bake pageview data for new terms
        if: env.TASK == 'publish'
        run: node scripts/refresh-data.mjs
      - name: Add sources for new terms
        if: env.TASK == 'publish'
        run: node scripts/enrich.mjs
      - name: Social cards for new pages
        if: env.TASK == 'publish'
        continue-on-error: true
        run: |
          SKIP_WIKI=1 node build.mjs --cards /tmp/cards.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/cards.json'));const m=c.filter(x=>!fs.existsSync('src/og/'+x.path+'.jpg'));fs.writeFileSync('/tmp/missing.json',JSON.stringify(m));console.log('cards to make:',m.length);process.exit(m.length?0:1)" || exit 0
          npm i --no-save --no-package-lock playwright @fontsource/big-shoulders-display @fontsource/ibm-plex-mono
          npx playwright install --with-deps chromium
          node scripts/og-cards.mjs /tmp/missing.json

      # ---- monthly ----
      - name: Monthly full refresh
        if: env.TASK == 'refresh-all'
        run: node scripts/refresh-data.mjs --all && node scripts/enrich.mjs --all

      - name: Build check
        if: env.TASK != 'mine'
        run: node build.mjs | tail -3

      - name: Commit to main
        run: |
          git config user.name "deduplication-bot"; git config user.email "bot@deduplication.tech"
          git add src discovery
          git diff --cached --quiet && echo "nothing new" && exit 0
          if [ "$TASK" = "mine" ]; then MSG="[queue] Mined new candidates $(date -u +%F)"; else MSG="Auto ($TASK): $(date -u +%F)"; fi
          git commit -m "$MSG"
          git pull --rebase origin main && git push
